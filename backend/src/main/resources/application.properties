spring.application.name=crypto-advisor-backend

# Render (and similar) set PORT; local dev defaults to 8080
server.port=${PORT:8080}

# IMPORTANT: configure this via env var in local/dev/prod
# Example: export MONGODB_URI="mongodb+srv://USER:PASS@host/db?retryWrites=true&w=majority"
spring.data.mongodb.uri=${MONGODB_URI:MONGODB_URI_NOT_SET}
spring.data.mongodb.database=${MONGODB_DATABASE:cryptoadvisor}

# Optional; app falls back if not provided
openrouter.api.key=${OPENROUTER_API_KEY:dummy}

# JWT signing key (must be long enough for HS256). Set in environment.
# For production, always set JWT_SECRET via environment.
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-1234567890}